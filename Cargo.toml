[workspace]
[package]
name = "voltage_modbus"
version = "1.0.0"
edition = "2021"
rust-version = "1.85.0"
authors = ["Evan Liu <liuyifanz.1996@gmail.com>"]
description = "A high-performance industrial Modbus library for Rust with TCP and RTU support"
license = "MIT"
repository = "https://github.com/EvanL1/voltage_modbus"
documentation = "https://docs.rs/voltage_modbus"
readme = "README.md"
keywords = ["modbus", "industrial", "automation", "tcp", "rtu"]
categories = ["network-programming", "embedded", "no-std"]
include = [
    "src/**/*.rs",
    "examples/**/*.rs",
    "benches/**/*.rs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

[lib]
name = "voltage_modbus"
path = "src/lib.rs"

[dependencies]
# Async runtime (std only)
tokio = { version = "1.0", features = ["full"], optional = true }

# Error handling — thiserror requires std; used only in std builds
thiserror = { version = "1.0", optional = true }

# Logging — tracing supports no_std via its default-features = false path
tracing = { version = "0.1", default-features = false }

# CRC — supports no_std natively
crc = "3.0"

# defmt — optional, for embedded logging
defmt = { version = "0.3", optional = true }

# RTU serial support (optional, requires std)
tokio-serial = { version = "5.4", optional = true }

# Modbus/TCP Security (TLS) support (optional, requires std)
# default-features off: use the ring provider to avoid the aws-lc-rs C/asm build
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = [
    "ring",
    "logging",
    "tls12",
] }

# Embedded async I/O (no_std compatible)
embedded-io-async = { version = "0.6", default-features = false, optional = true }

# Heapless collections for no_alloc embedded buffers
heapless = { version = "0.8", default-features = false, optional = true }

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.4"
# Self-signed certificates for TLS loopback tests
rcgen = "0.13"

[[bench]]
name = "throughput"
harness = false
required-features = ["std"]

[features]
# std feature enables all async/network capabilities (default ON for backwards compat)
default = ["std"]
std = [
    "dep:tokio",
    "dep:thiserror",
]
rtu = ["std", "dep:tokio-serial"]

# Modbus/TCP Security: TLS client transport (IANA port 802) via tokio-rustls
tls = ["std", "dep:tokio-rustls"]

# defmt integration — derives `defmt::Format` for no_std-safe public types
# (ModbusError, ModbusFunction, ModbusException). Pairs well with `embedded`
# for RTT/USB logging on MCUs. Enables defmt's `alloc` feature so variants
# carrying `String` payloads can be formatted.
defmt = ["dep:defmt", "defmt/alloc"]

# Embedded transport: no_std + alloc, uses embedded-io-async + heapless
# Usage: cargo build --no-default-features --features embedded
embedded = ["dep:embedded-io-async", "dep:heapless"]

# no_std builds use: cargo build --no-default-features

[[bin]]
name = "demo"
path = "src/bin/demo.rs"
required-features = ["std"]

[[example]]
name = "tcp_client"
path = "examples/tcp_client.rs"
required-features = ["std"]

[[example]]
name = "read_meter"
path = "examples/read_meter.rs"
required-features = ["std"]

[[example]]
name = "batch_read"
path = "examples/batch_read.rs"
required-features = ["std"]

[[example]]
name = "data_types"
path = "examples/data_types.rs"
required-features = ["std"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints.rust]
# `fuzzing` is set by cargo-fuzz; it gates the `*_fuzz` entry points.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
